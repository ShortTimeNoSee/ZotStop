appId: dev.zotstop.app
---
- launchApp:
    clearState: true
    permissions:
      all: deny
- assertVisible: "ZotStop"
- scrollUntilVisible:
    element: "All routes"
    timeout: 90000
- tapOn: "Routes"
- scrollUntilVisible:
    element: "Show routes on the map or open one to see its stops."
- assertVisible: "Show routes on the map or open one to see its stops."
- scrollUntilVisible:
    element: ".*Arroyo Vista · Camino del Sol.*"
- tapOn: ".*Arroyo Vista · Camino del Sol.*"
- scrollUntilVisible:
    element: "All routes"
- scrollUntilVisible:
    element: "Expand map"
    direction: UP
- tapOn: "Expand map"
- assertVisible: "Close full screen map"
- assertNotVisible: "Share ride"
- tapOn: "Show map movement controls"
- assertVisible: "Reset map view and north"
- tapOn: "Hide map movement controls"
- assertNotVisible: "Reset map view and north"
- pressKey: Back
- scrollUntilVisible:
    element: "All routes"
- extendedWaitUntil:
    visible: "Expand map"
    timeout: 15000
- tapOn: "Saved"
- scrollUntilVisible:
    element: "Nothing saved yet"
- assertVisible: "Save a route view from the map, or open a stop and save it here."
